name: book_store
description: A Flutter application for a book store with cart functionality.

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  go_router: ^12.0.0
  get_it: ^7.6.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.0
  uuid: ^4.0.0
  intl: ^0.18.1
  badges: ^3.1.1
  flutter_svg: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  bloc_test: ^9.1.4
  mockito: ^5.4.2
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
