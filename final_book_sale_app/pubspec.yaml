name: final_book_sale_app
description: A simple book sale application using BLoC, GoRouter, and Sqflite or LocalStorage.

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5
  go_router: ^10.1.0
  get_it: ^7.6.4
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.0.14
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/books.json
