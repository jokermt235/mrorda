name: flutter_shopping
description: A Flutter project developed by Madina Toygonbaeva.

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  responsive_framework: ^1.0.0
  connectivity_plus: ^4.0.0
  flash: ^3.0.3+5
  flutter_bloc: ^8.1.2
  equatable: ^2.0.5
  drift: ^2.15.0
  sqlite3: ^2.0.0
  ffi: ^2.1.0
  path_provider: ^2.0.0
  path: ^1.8.3
  go_router: ^7.0.1
  get_it: ^7.6.0
  http: ^1.2.0

dev_dependencies:
  drift_dev: ^2.8.0
  build_runner: ^2.3.3
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
